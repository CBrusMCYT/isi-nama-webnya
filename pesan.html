<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pantai Teluk Penyu - Pemesanan Kamar Hotel</title><link rel="stylesheet" href="style.css"></head><body data-page="pesan"><main>
<section><h2>Pesan Kamar</h2><div class="orn"></div>
<form id="fpesan"><label>Nama lengkap<input name="nama" required></label>
<div class="row"><label>Check-in<input type="date" name="cin" required></label><label>Check-out<input type="date" name="cout" required></label></div>
<div class="row"><label>Tipe kamar<select name="kamar"><option value="Standar Pantai" data-h="350000">Standar Pantai - Rp 350.000</option><option value="Deluxe Teluk" data-h="550000">Deluxe Teluk - Rp 550.000</option><option value="Suite Penyu" data-h="900000">Suite Penyu - Rp 900.000</option></select></label><label>Jumlah tamu<input type="number" name="tamu" min="1" max="4" value="2" required></label></div>
<button class="cta" type="submit">Pesan Sekarang</button></form><div id="hasil"></div></section>
</main><script src="script.js"></script></body></html>
